[project]
name = "research-advisor"
version = "0.1.0"
description = "A personal research advisor: track what you've read, get recommended what to read next."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # Retrieval maths. Small, and imported at module scope by the recommender —
    # without them the web app cannot even start, so they are not optional.
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# The encoder. Heavy (pulls torch), and separable because harvesting can start
# while it downloads — but you need it before anything can be recommended.
embed = [
    "sentence-transformers>=3.0",
    # Int8 ONNX inference — ~4.5x faster than torch fp32 on CPU.
    "onnxruntime>=1.17",
    "optimum[onnxruntime]>=1.20",
]
# Lets an assistant you already run (Claude Desktop, say) query your library.
# A server, not a client: it answers questions and holds no credential.
mcp = [
    "mcp>=2.0",
]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
]
# Everything, for a machine you actually intend to use this on.
all = [
    "research-advisor[embed,mcp]",
]

[project.scripts]
advisor = "advisor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["advisor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
